name = "sislicit-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "sislicit-db"
database_id = "PLACEHOLDER_REPLACE_AFTER_wrangler_d1_create"

[vars]
# Origens CORS permitidas (separadas por vírgula, sem espaço)
CORS_ORIGINS = "https://sislicit.pages.dev,https://pan-xls.pages.dev,https://projetos-ept.github.io"
JWT_EXPIRES_IN = "86400"

# Secret (nunca colocar aqui):
#   wrangler secret put JWT_SECRET
#   → digite uma string aleatória: openssl rand -base64 32

[dev]
port = 8787
