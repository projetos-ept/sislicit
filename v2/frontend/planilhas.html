<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SisLicit — Planilhas</title>
  <link rel="stylesheet" href="assets/style.css">
  <script>window.API_BASE = 'https://sislicit-api.lucas-batista-biomedico.workers.dev';</script>
</head>
<body>
<nav class="navbar">
  <span class="navbar-brand">Sis<span>Licit</span></span>
  <div class="navbar-links">
    <a href="planilhas.html" class="active">Planilhas</a>
    <a href="admin.html" data-admin-only>Admin</a>
  </div>
  <div class="navbar-user">
    <span id="nav-user"></span>
    <button class="btn btn-ghost btn-sm" onclick="logout()">Sair</button>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <div>
      <h1>Planilhas</h1>
      <p id="listaResumo" class="text-muted" style="font-size:0.82rem;margin-top:2px;"></p>
    </div>
    <button class="btn btn-primary" onclick="openNova()">+ Nova planilha</button>
  </div>

  <!-- Nova planilha panel -->
  <div id="novaPanel" class="card" style="display:none;margin-bottom:20px;">
    <div class="card-header">Nova planilha</div>
    <div class="card-body">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end;">
        <div class="form-group" style="margin:0">
          <label class="form-label">Título *</label>
          <input id="nv-titulo" class="form-control" placeholder="Ex.: Manutenção Predial 2026">
        </div>
        <div class="form-group" style="margin:0">
          <label class="form-label">Nº processo</label>
          <input id="nv-proc" class="form-control" placeholder="XXXX/2026">
        </div>
        <div class="form-group" style="margin:0">
          <label class="form-label">Descrição</label>
          <input id="nv-desc" class="form-control" placeholder="Opcional">
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn btn-primary" id="btn-criar">Criar</button>
        <button class="btn btn-secondary" onclick="closeNova()">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="form-group" style="max-width:320px;">
    <input id="busca" class="form-control" placeholder="🔎 Buscar por título ou nº processo…">
  </div>

  <div id="lista" class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Título</th>
            <th>Nº processo</th>
            <th>Itens</th>
            <th>Total</th>
            <th>Criado em</th>
            <th>Atualizado</th>
            <th style="text-align:right;">Ações</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="empty" class="card-body text-muted hidden" style="text-align:center;padding:40px;">Nenhuma planilha ainda.</div>
    <div id="semResultado" class="card-body text-muted hidden" style="text-align:center;padding:40px;">Nenhuma planilha encontrada para essa busca.</div>
  </div>
</div>

<!-- Rename modal -->
<div id="renameModal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h3>Renomear planilha</h3>
      <button class="btn btn-ghost" onclick="closeRename()">✕</button>
    </div>
    <div class="form-group"><label class="form-label">Título *</label><input id="rn-titulo" class="form-control"></div>
    <div class="form-group"><label class="form-label">Nº processo</label><input id="rn-proc" class="form-control"></div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary" id="btn-rename">Salvar</button>
      <button class="btn btn-secondary" onclick="closeRename()">Cancelar</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="assets/app.js"></script>
<script>
requireAuth();

const fmtDate = (s) => s ? new Date(s.replace(' ','T')+'Z').toLocaleDateString('pt-BR') : '—';

let PLANILHAS = [];

function renderSkeleton(rows = 4) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = Array.from({ length: rows }).map(() =>
    `<tr class="skeleton-row"><td>x</td><td>x</td><td>x</td><td>x</td><td>x</td><td>x</td><td>x</td></tr>`
  ).join('');
}

async function load() {
  renderSkeleton();
  document.getElementById('empty').classList.add('hidden');
  document.getElementById('semResultado').classList.add('hidden');
  const res = await apiFetch('/api/planilhas');
  if (!res.ok) { document.getElementById('tbody').innerHTML = ''; return; }
  const { planilhas } = await res.json();
  if (!planilhas.length) {
    PLANILHAS = [];
    document.getElementById('tbody').innerHTML = '';
    document.getElementById('empty').classList.remove('hidden');
    document.getElementById('listaResumo').textContent = '';
    return;
  }

  // Resumo (itens/total) não vem na listagem — busca o detalhe de cada
  // planilha em paralelo pra completar sem precisar mudar o backend.
  PLANILHAS = await Promise.all(planilhas.map(async p => {
    try {
      const r = await apiFetch(`/api/planilhas/${p.id}`);
      if (!r.ok) return { ...p, _itens: null, _total: null, _total_fmt: null };
      const d = await r.json();
      return { ...p, _itens: d.itens?.length ?? 0, _total: d.total ?? 0, _total_fmt: d.total_fmt };
    } catch {
      return { ...p, _itens: null, _total: null, _total_fmt: null };
    }
  }));
  renderResumoGeral(PLANILHAS);
  renderLista(PLANILHAS);
}

function renderResumoGeral(planilhas) {
  const totalItens = planilhas.reduce((s, p) => s + (p._itens ?? 0), 0);
  const totalGeral = planilhas.reduce((s, p) => s + (p._total ?? 0), 0);
  document.getElementById('listaResumo').textContent =
    `${planilhas.length} planilha${planilhas.length !== 1 ? 's' : ''} · ${totalItens} ${totalItens !== 1 ? 'itens' : 'item'} · ${fmtBRL(totalGeral)} no total`;
}

function renderLista(planilhas) {
  const tbody = document.getElementById('tbody');
  const semResultado = document.getElementById('semResultado');
  tbody.innerHTML = '';
  semResultado.classList.toggle('hidden', planilhas.length > 0 || !PLANILHAS.length);
  const isAdmin = getUser()?.role === 'admin';
  planilhas.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><a href="detalhe.html?id=${p.id}" style="font-weight:500;">${p.titulo}</a></td>
      <td class="text-muted mono">${p.numero_proc ?? '—'}</td>
      <td class="text-muted">${p._itens ?? '—'}</td>
      <td class="mono" style="font-weight:500;">${p._total_fmt ?? '—'}</td>
      <td class="text-muted">${fmtDate(p.criado_em)}</td>
      <td class="text-muted">${fmtDate(p.atualizado_em)}</td>
      <td style="text-align:right;white-space:nowrap;">
        <a href="detalhe.html?id=${p.id}" class="btn btn-secondary btn-sm">Abrir</a>
        <button class="btn btn-ghost btn-sm" title="Renomear" onclick="openRename(${p.id})">✎</button>
        <button class="btn btn-ghost btn-sm" title="Duplicar" onclick="duplicarPlanilha(${p.id}, this)">⧉</button>
        ${isAdmin ? `<button class="btn btn-ghost btn-sm" title="Excluir" style="color:var(--danger)" onclick="excluirPlanilha(${p.id})">🗑</button>` : ''}
      </td>`;
    tbody.appendChild(tr);
  });
}

document.getElementById('busca').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const filtradas = q
    ? PLANILHAS.filter(p => p.titulo.toLowerCase().includes(q) || (p.numero_proc ?? '').toLowerCase().includes(q))
    : PLANILHAS;
  renderResumoGeral(filtradas);
  renderLista(filtradas);
});

function openRename(id) {
  const p = PLANILHAS.find(x => x.id === id);
  if (!p) return;
  document.getElementById('renameModal').dataset.id = id;
  document.getElementById('rn-titulo').value = p.titulo;
  document.getElementById('rn-proc').value = p.numero_proc ?? '';
  document.getElementById('renameModal').classList.add('open');
}
function closeRename() { document.getElementById('renameModal').classList.remove('open'); }

async function salvarRename() {
  await withBusy(document.getElementById('btn-rename'), 'Salvando…', async () => {
    const id = Number(document.getElementById('renameModal').dataset.id);
    const titulo = document.getElementById('rn-titulo').value.trim();
    if (!titulo) { toast('Título obrigatório', 'err'); return; }
    const res = await apiFetch(`/api/planilhas/${id}`, {
      method: 'PATCH',
      body: JSON.stringify({ titulo, numero_proc: document.getElementById('rn-proc').value.trim() || null }),
    });
    if (res.ok) { closeRename(); load(); toast('Renomeado', 'ok'); }
    else toast((await res.json()).error ?? 'Erro', 'err');
  });
}

async function duplicarPlanilha(id, btn) {
  await withBusy(btn, '…', async () => {
    const res = await apiFetch(`/api/planilhas/${id}/duplicar`, { method: 'POST' });
    const d = await res.json();
    if (res.ok) { toast('Planilha duplicada', 'ok'); load(); }
    else toast(d.error ?? 'Erro', 'err');
  });
}

async function excluirPlanilha(id) {
  if (!confirm('Excluir esta planilha e todos os seus itens? Essa ação não pode ser desfeita.')) return;
  const res = await apiFetch(`/api/planilhas/${id}`, { method: 'DELETE' });
  const d = await res.json();
  if (res.ok) { toast('Planilha excluída', 'ok'); load(); }
  else toast(d.error ?? 'Erro', 'err');
}

function openNova()  { document.getElementById('novaPanel').style.display = ''; document.getElementById('nv-titulo').focus(); }
function closeNova() { document.getElementById('novaPanel').style.display = 'none'; }

async function criarPlanilha() {
  await withBusy(document.getElementById('btn-criar'), 'Criando…', async () => {
    const titulo = document.getElementById('nv-titulo').value.trim();
    if (!titulo) { toast('Título obrigatório', 'err'); return; }
    const res = await apiFetch('/api/planilhas', {
      method: 'POST',
      body: JSON.stringify({ titulo, numero_proc: document.getElementById('nv-proc').value.trim() || null, descricao: document.getElementById('nv-desc').value.trim() || null }),
    });
    const d = await res.json();
    if (res.ok) { closeNova(); window.location.href = `detalhe.html?id=${d.planilha.id}`; }
    else toast(d.error ?? 'Erro', 'err');
  });
}

document.getElementById('btn-criar').addEventListener('click', criarPlanilha);
document.getElementById('btn-rename').addEventListener('click', salvarRename);
['nv-titulo', 'nv-proc', 'nv-desc'].forEach(id =>
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') criarPlanilha(); })
);
['rn-titulo', 'rn-proc'].forEach(id =>
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') salvarRename(); })
);

load();
</script>
</body>
</html>
